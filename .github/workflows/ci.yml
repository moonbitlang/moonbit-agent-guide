name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [nightly, latest]
    name: test (${{ matrix.channel }})
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit (${{ matrix.channel }})
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s ${{ matrix.channel }}
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: moon version
        run: moon version --all

      - name: Test moonbit-agent-guide examples
        working-directory: moonbit-agent-guide
        run: |
          moon check SKILL.mbt.md --deny-warn --no-render
          moon test SKILL.mbt.md --deny-warn --no-render

      - name: Test language fundamentals
        working-directory: moonbit-agent-guide
        run: |
          moon check references/moonbit-language-fundamentals.mbt.md --deny-warn --no-render
          moon test references/moonbit-language-fundamentals.mbt.md --deny-warn --no-render
